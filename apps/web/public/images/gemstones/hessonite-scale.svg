<svg width="600" height="450" viewBox="0 0 600 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="450" fill="#FAF8F2"/>
  <rect x="15" y="15" width="570" height="420" stroke="#DDD8CC" stroke-width="1" stroke-dasharray="3 3"/>
  
  <!-- Metric Millimeter Ruler -->
  <rect x="80" y="270" width="440" height="45" fill="#E6DEC8" stroke="#174C38" stroke-width="1.5"/>
  <!-- Ruler ticks -->
  <g stroke="#174C38" stroke-width="1">
    <line x1="100" y1="270" x2="100" y2="295"/>
    <line x1="140" y1="270" x2="140" y2="285"/>
    <line x1="180" y1="270" x2="180" y2="295"/>
    <line x1="220" y1="270" x2="220" y2="285"/>
    <line x1="260" y1="270" x2="260" y2="295"/>
    <line x1="300" y1="270" x2="300" y2="285"/>
    <line x1="340" y1="270" x2="340" y2="295"/>
    <line x1="380" y1="270" x2="380" y2="285"/>
    <line x1="420" y1="270" x2="420" y2="295"/>
    <line x1="460" y1="270" x2="460" y2="285"/>
    <line x1="500" y1="270" x2="500" y2="295"/>
  </g>
  <text x="100" y="308" font-family="sans-serif" font-size="10" fill="#174C38" text-anchor="middle">0</text>
  <text x="180" y="308" font-family="sans-serif" font-size="10" fill="#174C38" text-anchor="middle">10mm</text>
  <text x="260" y="308" font-family="sans-serif" font-size="10" fill="#174C38" text-anchor="middle">20mm</text>
  <text x="340" y="308" font-family="sans-serif" font-size="10" fill="#174C38" text-anchor="middle">30mm</text>
  <text x="420" y="308" font-family="sans-serif" font-size="10" fill="#174C38" text-anchor="middle">40mm</text>
  <text x="500" y="308" font-family="sans-serif" font-size="10" fill="#174C38" text-anchor="middle">50mm</text>
  
  <!-- Rough specimen on ruler -->
  <ellipse cx="230" cy="220" rx="45" ry="32" fill="#D97736" stroke="#B99B68" stroke-width="2"/>
  <ellipse cx="360" cy="210" rx="36" ry="28" fill="#D97736" stroke="#B99B68" stroke-width="2"/>
  
  <text x="300" y="60" text-anchor="middle" font-family="serif" font-size="18" font-weight="600" fill="#174C38">CALIBRATED SCALE REFERENCE</text>
  <text x="300" y="85" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="500" fill="#6E756F">PIECE SIZE VERIFICATION (8mm – 22mm SIEVE RANGE)</text>
  
  <rect x="130" y="380" width="340" height="26" rx="4" fill="#F3EFE5" stroke="#B99B68" stroke-width="1"/>
  <text x="300" y="397" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="500" fill="#174C38">MILLIMETER BENCH SCALE • PENDING CLIENT DELIVERY</text>
</svg>
