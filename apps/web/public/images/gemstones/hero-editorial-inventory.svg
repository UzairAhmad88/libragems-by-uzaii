<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Subtle warm ivory background with fine architectural grid -->
  <rect width="800" height="600" fill="#FAF8F2"/>
  <rect x="20" y="20" width="760" height="560" stroke="#DDD8CC" stroke-width="1" stroke-dasharray="4 4"/>
  
  <!-- Subtle circular gemological focus guides -->
  <circle cx="400" cy="300" r="220" stroke="#DDD8CC" stroke-width="1"/>
  <circle cx="400" cy="300" r="140" stroke="#DDD8CC" stroke-width="1" stroke-dasharray="2 2"/>
  
  <!-- Abstract Geometric Representations of the 3 Materials -->
  <!-- 1. Hessonite Garnet (Warm amber-cinnamon organic polygon) -->
  <path d="M260 280 L320 210 L390 240 L380 340 L300 370 L250 320 Z" fill="#D97736" fill-opacity="0.85" stroke="#B99B68" stroke-width="2"/>
  
  <!-- 2. Turquoise (Vibrant Cyan-Blue Nodule with limonite matrix veining) -->
  <path d="M430 200 L510 180 L560 250 L530 320 L450 310 L410 260 Z" fill="#2E9E9B" fill-opacity="0.85" stroke="#174C38" stroke-width="2"/>
  <path d="M450 210 Q 480 250 520 240" stroke="#103729" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M480 250 Q 470 290 510 300" stroke="#103729" stroke-width="2" stroke-linecap="round"/>
  
  <!-- 3. Afghanistan Cut Rubellite Tourmaline (Precision Faceted Oval Octagon) -->
  <polygon points="350,380 450,380 490,420 490,470 450,510 350,510 310,470 310,420" fill="#C23B58" fill-opacity="0.85" stroke="#103729" stroke-width="2"/>
  <polygon points="370,400 430,400 460,430 460,460 430,490 370,490 340,460 340,430" fill="none" stroke="#FAF8F2" stroke-width="1.5"/>
  <line x1="350" y1="380" x2="370" y2="400" stroke="#FAF8F2" stroke-width="1.5"/>
  <line x1="450" y1="380" x2="430" y2="400" stroke="#FAF8F2" stroke-width="1.5"/>
  <line x1="490" y1="420" x2="460" y2="430" stroke="#FAF8F2" stroke-width="1.5"/>
  <line x1="490" y1="470" x2="460" y2="460" stroke="#FAF8F2" stroke-width="1.5"/>
  <line x1="450" y1="510" x2="430" y2="490" stroke="#FAF8F2" stroke-width="1.5"/>
  <line x1="350" y1="510" x2="370" y2="490" stroke="#FAF8F2" stroke-width="1.5"/>
  <line x1="310" y1="470" x2="340" y2="460" stroke="#FAF8F2" stroke-width="1.5"/>
  <line x1="310" y1="420" x2="340" y2="430" stroke="#FAF8F2" stroke-width="1.5"/>

  <!-- Editorial Typography & Brand Coordinates -->
  <text x="400" y="80" text-anchor="middle" font-family="serif" font-size="20" font-weight="600" fill="#174C38" letter-spacing="2">LIBRA GEMS &amp; TRADING CO., LTD.</text>
  <text x="400" y="105" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="500" fill="#6E756F" letter-spacing="1.5">BANG RAK, BANGKOK • GEMOLOGICAL INVENTORY ARCHIVE</text>

  <!-- Compliance Banner at Bottom -->
  <rect x="180" y="535" width="440" height="30" rx="4" fill="#F3EFE5" stroke="#B99B68" stroke-width="1"/>
  <text x="400" y="554" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="500" fill="#174C38">AUTHENTIC INVENTORY PHOTOGRAPHY PENDING CLIENT DELIVERY • ADR-13 PROTOCOL</text>
</svg>
