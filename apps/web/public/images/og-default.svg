<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#103729" />
      <stop offset="100%" stop-color="#0a231a" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="50%" stop-color="#B99B68" />
      <stop offset="100%" stop-color="#9a7b45" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)" />

  <!-- Outer Border Frame -->
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="#B99B68" stroke-width="1.5" stroke-opacity="0.4" />
  <rect x="52" y="52" width="1096" height="526" fill="none" stroke="#B99B68" stroke-width="0.75" stroke-opacity="0.2" />

  <!-- Corner Flourishes -->
  <path d="M 40 70 L 70 70 L 70 40" fill="none" stroke="#B99B68" stroke-width="2" />
  <path d="M 1160 70 L 1130 70 L 1130 40" fill="none" stroke="#B99B68" stroke-width="2" />
  <path d="M 40 560 L 70 560 L 70 590" fill="none" stroke="#B99B68" stroke-width="2" />
  <path d="M 1160 560 L 1130 560 L 1130 590" fill="none" stroke="#B99B68" stroke-width="2" />

  <!-- Gemstone Facet Geometry Motif (Right Side) -->
  <g transform="translate(860, 315) scale(1.6)" stroke="#B99B68" stroke-opacity="0.35" fill="none" stroke-width="1.2">
    <!-- Octagonal Emerald/Facet Cut Silhouette -->
    <polygon points="0,-90 64,-64 90,0 64,64 0,90 -64,64 -90,0 -64,-64" />
    <!-- Inner Table -->
    <polygon points="0,-50 35,-35 50,0 35,35 0,50 -35,35 -50,0 -35,-35" />
    <!-- Connecting Facets -->
    <line x1="0" y1="-90" x2="0" y2="-50" />
    <line x1="64" y1="-64" x2="35" y2="-35" />
    <line x1="90" y1="0" x2="50" y2="0" />
    <line x1="64" y1="64" x2="35" y2="35" />
    <line x1="0" y1="90" x2="0" y2="50" />
    <line x1="-64" y1="64" x2="-35" y2="35" />
    <line x1="-90" y1="0" x2="-50" y2="0" />
    <line x1="-64" y1="-64" x2="-35" y2="-35" />
    <!-- Center Point Glow -->
    <circle cx="0" cy="0" r="3" fill="#B99B68" fill-opacity="0.6" />
  </g>

  <!-- Typography Content -->
  <!-- Top Pill / Jurisdiction -->
  <g transform="translate(100, 140)">
    <rect width="260" height="32" rx="16" fill="#174C38" stroke="#B99B68" stroke-width="1" stroke-opacity="0.6" />
    <text x="130" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#B99B68" text-anchor="middle">
      BANGKOK TRADING DESK
    </text>
  </g>

  <!-- Brand Logotype -->
  <text x="100" y="240" font-family="'Times New Roman', Times, Georgia, serif" font-size="68" font-weight="500" letter-spacing="1" fill="#FAF8F2">
    LibraGems
  </text>
  
  <text x="100" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="4" fill="#B99B68">
    LIBRA GEMS &amp; TRADING CO., LTD.
  </text>

  <!-- Value Proposition -->
  <text x="100" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="400" fill="#F3EFE5">
    International Gemstone Trading &amp; Sourcing
  </text>
  
  <text x="100" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="300" fill="#FAF8F2" fill-opacity="0.8">
    Commercial Rough Parcels &bull; Mineral Specimens &bull; Precision-Cut Stones
  </text>

  <text x="100" y="410" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="300" fill="#FAF8F2" fill-opacity="0.65">
    CIBJO Ethical Treatment Disclosure &bull; Independent Bangkok Laboratory Testing
  </text>

  <!-- Bottom Divider & Domain -->
  <line x1="100" y1="480" x2="720" y2="480" stroke="#B99B68" stroke-opacity="0.3" stroke-width="1" />
  
  <text x="100" y="525" font-family="'Courier New', Courier, monospace" font-size="16" font-weight="600" letter-spacing="1" fill="#B99B68">
    https://libragems.net
  </text>
  
  <text x="560" y="525" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#FAF8F2" fill-opacity="0.6">
    B2B Wholesale Inquiries Only
  </text>
</svg>

